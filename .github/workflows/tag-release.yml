name: Tag package release

on:
  push:
    branches: [main]
    paths:
      - package.json

permissions:
  contents: read

concurrency:
  group: tag-package-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.release.outputs.changed }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: Resolve version change
        id: release
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          previous_version="$(git show "${BEFORE_SHA}:package.json" | jq -er '.version')"
          current_version="$(jq -er '.version' package.json)"
          plan="$(bun scripts/release-version.ts "$previous_version" "$current_version")"
          echo "changed=$(jq -r '.changed' <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "tag=$(jq -r '.tag // ""' <<<"$plan")" >> "$GITHUB_OUTPUT"

  tag:
    name: Create release tag
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create and push annotated tag
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse --quiet --verify "refs/tags/${RELEASE_TAG}"; then
            echo "Tag ${RELEASE_TAG} already exists" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$RELEASE_TAG" --message "Release $RELEASE_TAG" "$GITHUB_SHA"
          git push origin "$RELEASE_TAG"

  release:
    name: Run release workflow
    needs: [prepare, tag]
    if: needs.prepare.outputs.changed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ needs.prepare.outputs.tag }}
